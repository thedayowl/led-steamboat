# Builds the firmware on every push and pull request.
# Pushing a version tag (e.g. `git tag v1.3.0 && git push origin v1.3.0`)
# also creates a GitHub release with the factory and OTA images attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release on tag pushes

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, so scripts/version.py can run git describe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build
        run: pio run -e usb

      - name: Collect binaries
        id: bins
        run: |
          VERSION=$(git describe --tags --match 'v[0-9]*' --always --dirty)
          case "$VERSION" in v*) VERSION=${VERSION#v} ;; *) VERSION=0.0.0-g$VERSION ;; esac
          mkdir dist
          cp .pio/build/usb/factory.bin  "dist/led-steamboat-$VERSION-factory.bin"
          cp .pio/build/usb/firmware.bin "dist/led-steamboat-$VERSION-ota.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: led-steamboat-${{ steps.bins.outputs.version }}
          path: dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bins.outputs.version }}
        run: |
          # The release must be built from exactly the tagged commit.
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Built version $VERSION does not match tag $GITHUB_REF_NAME"; exit 1
          fi
          cat > notes.md <<EOF
          Steamboat lights firmware $VERSION for the GLEDOPTO GL-C-017WL-D (ESP32).

          **Files**
          - \`led-steamboat-$VERSION-factory.bin\`: full image (bootloader, partition table, app) for a new board or one running WLED. Flash it at offset **0x0**:
            \`esptool.py --chip esp32 write_flash 0x0 led-steamboat-$VERSION-factory.bin\`
          - \`led-steamboat-$VERSION-ota.bin\`: app only, for boards already running this firmware. Upload it from the web page (**Firmware update**). Settings are kept.

          SHA-256:
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.bin \
            --title "Steamboat lights $VERSION" \
            --notes-file notes.md
