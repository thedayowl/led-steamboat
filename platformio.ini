; Steamboat lights - PlatformIO project
; Build/flash over USB:   pio run -e usb -t upload
; Serial console:         pio device monitor -e usb
; Update over Wi-Fi:      pio run -e ota -t upload   (after the first USB flash)
;                         or upload .pio/build/usb/firmware.bin on the web page
;                         (Firmware update section)

[platformio]
; pioarduino installs its own fork of PlatformIO and its own toolchains into
; the core folder. Keep that out of the shared ~/.platformio so other projects
; using the official platform aren't affected.
core_dir = ~/.platformio-pioarduino

[env]
; Arduino-ESP32 core 3.3.12 on ESP-IDF 5.5.5, from the pioarduino community
; platform (the official PlatformIO platform stops at core 2.0.17).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
; Two 1.875 MB app slots, so OTA updates work with room for TLS (GitHub updates).
; Settings live in NVS, which is at the same place as in default.csv; the
; SPIFFS area (unused) shrinks to 128 KB. Changed in 1.4.0: boards running an
; older build need one USB flash to get this layout before OTA updates fit.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = direct
build_flags =
    -D CORE_DEBUG_LEVEL=0
extra_scripts =
    pre:scripts/version.py          ; FW_VERSION from the git tag (e.g. v1.2.0 -> "1.2.0")
    post:scripts/factory.py         ; also writes factory.bin (full image for 0x0)

[env:usb]
upload_speed = 921600

[env:ota]
upload_protocol = espota
upload_port = steamboat.local       ; or the board's IP address
upload_flags =
    --auth=steamboat                ; the admin password (ADMIN_PASSWORD, or as changed with "admin pass")
