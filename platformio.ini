; Steamboat lights - PlatformIO project
; Build/flash over USB:   pio run -e usb -t upload
; Serial console:         pio device monitor -e usb
; Update over Wi-Fi:      pio run -e ota -t upload   (after the first USB flash)
;                         or upload .pio/build/usb/firmware.bin on the web page
;                         (Firmware update section)

[env]
platform = espressif32@6.9.0        ; Arduino-ESP32 core 2.0.17 (same base WLED uses)
board = esp32dev
framework = arduino
board_build.partitions = default.csv  ; two app slots, so OTA updates work
monitor_speed = 115200
monitor_filters = direct
build_flags =
    -D CORE_DEBUG_LEVEL=0
extra_scripts =
    pre:scripts/version.py          ; FW_VERSION from the git tag (e.g. v1.2.0 -> "1.2.0")
    post:scripts/factory.py         ; also writes factory.bin (full image for 0x0)

[env:usb]
upload_speed = 921600

[env:ota]
upload_protocol = espota
upload_port = steamboat.local       ; or the board's IP address
upload_flags =
    --auth=steamboat                ; the admin password (ADMIN_PASSWORD, or as changed with "admin pass")
